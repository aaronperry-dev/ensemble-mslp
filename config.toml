# ---------------------------------------------------------------------------
# GEFS MSLP viewer - pipeline configuration
# ---------------------------------------------------------------------------

[run]
families = ["gefs", "ifs", "geps", "aigefs"]   # ensemble systems to fetch; blend views are added automatically (see [blend])
# Families that never hold a cycle back.  AIGEFS is published irregularly (7.5 h to more than a day after cycle time):
# the build uses it when it is complete, and a scheduled run rebuilds the already-live cycle when it turns up later.
optional = ["aigefs"]
# Cycles the build may use.  ECMWF only publishes the full 10-day range (and beyond) on 00/12Z; its 06/18Z runs
# stop at 144 h.  [0, 12] therefore guarantees 10 days for every view including the blend; use [0, 6, 12, 18]
# to also build the 06/18Z cycles (the ECMWF and blend views then end at 6 days on those runs).
cycles   = [0, 12]

[blend]
# How the blended ensemble MEAN is formed:
#   "equal"   - average of the family means, each system counts once (the usual multi-system convention)
#   "members" - mean of all members pooled, so a bigger ensemble weighs more (IFS 51 vs GEFS 31)
# The blended MINIMUM is always the lowest value over every member of every system, and the blended low
# markers are every member's lows from the chosen systems.  Blends of ANY combination of systems, and the swath
# (running minimum), are computed in the browser from the per-system grids, so they cost nothing in site size.
weighting = "equal"

[source]                        # ---- NOAA GEFS (AWS Open Data: noaa-gefs-pds) ----
base_url      = "https://noaa-gefs-pds.s3.amazonaws.com"
n_perturbed   = 30              # gep01 .. gep30 (control member gec00 is always added)
variable      = "PRMSL"         # GRIB short name as written in the .idx files
level         = "mean sea level"

# Products are tried in order, i.e. HIGHEST RESOLUTION FIRST.
# Verified against the bucket: 0.25-deg ("pgrb2sp25") only exists for f000-f240;
# beyond that the pipeline automatically falls back to the 0.5-deg product.
[[source.products]]
dir            = "pgrb2sp25"
file_tag       = "pgrb2s.0p25"
resolution_deg = 0.25
max_fh         = 240

[[source.products]]
dir            = "pgrb2ap5"
file_tag       = "pgrb2a.0p50"
resolution_deg = 0.5
max_fh         = 384

[ifs]                           # ---- ECMWF IFS ENS (AWS Open Data: ecmwf-forecasts) ----
base_url          = "https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com"
model             = "ifs"
resolution        = "0p25"      # the highest resolution ECMWF publishes for the ensemble
n_perturbed       = 50          # ep01..ep50 from stream enfo; the control ec00 comes from stream oper (IFS >= 50r1)
param             = "msl"       # mean sea level pressure, as named in the .index files
full_range_cycles = [0, 12]     # these cycles publish to full_max_fh; the others stop at short_max_fh
full_max_fh       = 360
short_max_fh      = 144
requests_per_second = 3         # the ECMWF bucket answers 503 SlowDown above ~4-5 req/s from one client, so it gets its own, gentler cap

[geps]                          # ---- Canadian GEPS (ECCC MSC Datamart) ----
# {date} is replaced by the cycle date (YYYYMMDD); the Datamart keeps several recent days.
base_url            = "https://dd.weather.gc.ca/{date}/WXO-DD/ensemble/geps/grib2/raw"
variable            = "PRMSL_MSL_0"
grid                = "latlon0p5x0p5"   # 0.5 deg: the only resolution ECCC publishes for the raw members
n_perturbed         = 20                # control + 20 = 21 members, all inside one file per forecast hour
cycles              = [0, 12]           # runs that publish the full 384 h
max_fh              = 384
short_max_fh        = 144               # the 06/18Z runs are not part of the open raw GEPS product; be conservative
requests_per_second = 4                 # gentle: ~65 small requests per cycle in total

[aigefs]                        # ---- NOAA AIGEFS, AI ensemble (AWS Open Data: noaa-nws-graphcastgfs-pds) ----
base_url            = "https://noaa-nws-graphcastgfs-pds.s3.amazonaws.com/EAGLE_ensemble"
prefix              = "aigefs"          # directory aigefs.<YYYYMMDD>/<HH>/mem000 ..
n_members           = 31                # mem000 .. mem030
product             = "sfc"             # surface file (the pressure-level "pres" files are ~90 MB each and hold no MSLP)
variable            = "PRMSL"           # as written in the .idx
level               = "mean sea level"
max_fh              = 384               # 6-hourly, all four daily cycles
requests_per_second = 6

[forecast]
start = 0
stop  = 240                     # 10 days = f240, the full extent of the 0.25-deg product
step  = 6                       # 3 is also available at 0.25-deg but doubles download volume (81 frames, ~1.3 GB)

[domain]                        # data extent; the viewer cannot pan/zoom outside it (degrees east is positive)
west  = -150
east  = -40
south = 10
north = 65
pad_deg = 3                     # extra data kept around the domain so contours/lows are valid at the edges
initial_view = [21, -128, 53, -63]   # [south, west, north, east] the viewer opens on (CONUS)

[fetch]                         # --- polite-client settings -------------------------------------
workers             = 6         # parallel connections (keep small)
requests_per_second = 8         # global cap across all workers
timeout_connect_s   = 10
timeout_read_s      = 60
max_retries         = 6
backoff_base_s      = 1.0       # exponential backoff with jitter: 1, 2, 4, 8 ... capped at backoff_max_s
backoff_max_s       = 60
min_member_fraction = 0.8       # a frame is published only if >= this share of members arrived
user_agent          = "gefs-mslp-viewer/1.0 (+https://github.com/YOUR-USER/gefs-mslp-viewer)"

[lows]
threshold_hpa = 1005            # only report lows deeper than this (as in the reference GEFS image)
radius_deg    = 2.0             # a low must be the minimum within this radius
smooth_deg    = 0.5             # Gaussian smoothing used only to LOCATE minima (reported value is raw)
min_separation_deg = 1.5

[lows_min]                      # low centres of the member-wise MINIMUM field (one per envelope minimum)
threshold_hpa = 1005
radius_deg    = 3.0             # the envelope is broad, so use a wider search radius than for single members
smooth_deg    = 0.5
min_separation_deg = 3.0

# --- colour scale ----------------------------------------------------------------------------
# ONE scale shared by both products so they can be compared directly.  Classes are `step` hPa wide between
# `start` and `stop` (first class is open below, last is open above); each class gets one colour sampled
# (in OKLab) from a ColorBrewer ramp.  Segments are listed LOWEST pressure first:
#   upto = highest class upper-edge (hPa) that belongs to the segment (omit for the last segment)
#   t    = [position on the ramp at the lowest-pressure class, position at the highest-pressure class], 0..1
#          measured along the ramp *after* `reverse`.
[scale]
edges = { start = 948, stop = 1032, step = 4 }

[[scale.segments]]                # deep lows: bright pink -> deep purple as pressure falls
name  = "Deep lows (<980 hPa)"
ramp  = "RdPu"
upto  = 980
t     = [1.0, 0.5]

[[scale.segments]]                # moderate lows: mid blue -> navy as pressure falls
name  = "Lows (980-1000 hPa)"
ramp  = "Blues"
upto  = 1000
t     = [1.0, 0.75]

[[scale.segments]]                # >= 1000 hPa: ColorBrewer RdYlBu (9), blue = lower, pale yellow ~ 1016-1020, red = higher
name    = "1000 hPa and above"
ramp    = "RdYlBu"
reverse = true
t       = [0.0, 1.0]

# --- data products ---------------------------------------------------------------------------
[products.mean]
title    = "Ensemble-mean MSLP + member lows"
short    = "Mean + lows"
has_lows = true

[products.min]
title    = "Member-wise minimum MSLP"
short    = "Member minimum"
has_lows = true

[products.swath]                # running minimum of the member-wise minimum over every forecast hour so far
title    = "Accumulated member-wise minimum MSLP (swath)"
short    = "Swath"
has_lows = true

