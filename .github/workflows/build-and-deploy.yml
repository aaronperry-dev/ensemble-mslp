name: Build & deploy GEFS MSLP viewer

on:
  schedule:
    # GEFS cycles (00/06/12/18Z) finish publishing roughly 4.5-5.5 h after cycle time.
    # The pipeline selects the newest *complete* cycle itself and skips the deploy when the live
    # site already serves it, so being a little early or late here is harmless.
    - cron: "25 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Force a cycle YYYYMMDDHH (blank = newest complete cycle)"
        required: false
        default: ""
      max_fh:
        description: "Limit forecast hours, e.g. 120 for a quick test (blank = all, to f240 = 10 days)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the live site already has this cycle"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "gefs_pipeline/**"
      - "config.toml"
      - "requirements*.txt"
      - ".github/workflows/build-and-deploy.yml"
  pull_request:

permissions:
  contents: read

# Never run two Pages deployments at once; queue instead of cancelling a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: Resolve newest complete GEFS cycle
        id: resolve
        env:
          IN_CYCLE: ${{ inputs.cycle }}
          IN_FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          # Override with a repository variable SITE_URL if you use a custom domain.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          args=()
          if [ -n "$IN_CYCLE" ]; then args+=(--cycle "$IN_CYCLE"); fi
          # code pushes and forced runs always rebuild; scheduled runs skip if the site is already current
          if [ "$IN_FORCE" != "true" ] && [ "$EVENT" = "schedule" ]; then
            args+=(--skip-if-deployed "$SITE_URL/data/manifest.json")
          fi
          python -m gefs_pipeline resolve-cycle "${args[@]}"

      # Raw GRIB messages (~0.5 MB each, ~0.8 GB per cycle) are only cached when a build FAILS, so a re-run of the
      # same cycle resumes instead of re-downloading - without burning the repository's 10 GB cache quota every run.
      - name: Restore cached GRIB messages (resume after a failed run)
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/cache/restore@v5
        with:
          path: .cache/gefs
          key: gefs-${{ steps.resolve.outputs.cycle }}

      - name: Fetch (HTTP byte-range) and build site
        id: build
        if: steps.resolve.outputs.skip != 'true'
        env:
          CYCLE: ${{ steps.resolve.outputs.cycle }}
          MAX_FH: ${{ inputs.max_fh }}
        run: |
          args=(--cycle "$CYCLE" --out dist --min-frames 5)
          if [ -n "$MAX_FH" ]; then args+=(--max-fh "$MAX_FH"); fi
          python -m gefs_pipeline build "${args[@]}"

      - name: Save partial cache for a retry
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/cache/save@v5
        with:
          path: .cache/gefs
          key: gefs-${{ steps.resolve.outputs.cycle }}

      - name: Upload Pages artifact
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
